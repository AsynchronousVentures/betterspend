name: Docker CI

# Flow:
#   draft PR          -> classify -> fast CI or non-runtime pass -> agent marks ready
#   merge group       -> classify -> full CI or non-runtime pass -> validate result
#   push to main      -> runtime changes publish; non-runtime changes stop after validate
#   push v* tag       -> full validation -> ensure exact-SHA images -> promote
#   workflow_dispatch -> full CI -> validate result (manual re-check / republish)
#
# Releases are tags. Runtime changes publish sha-<sha> images from main. A tag
# can build missing immutable images after full validation before promotion.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: betterspend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  REGISTRY: ghcr.io

jobs:
  change-scope:
    name: Classify Changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            merge_group) base_sha="$MERGE_GROUP_BASE_SHA" ;;
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                node .github/scripts/ci-change-policy.mjs --force-runtime
                exit
              fi
              base_sha="$BEFORE_SHA"
              ;;
            workflow_dispatch)
              node .github/scripts/ci-change-policy.mjs --force-runtime
              exit
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! [[ "$base_sha" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]] ||
            ! git cat-file -e "$base_sha^{commit}"; then
            echo "Unable to resolve a safe comparison base; requiring runtime validation."
            node .github/scripts/ci-change-policy.mjs --force-runtime
            exit
          fi

          git diff --no-renames --name-only -z "$base_sha" "$GITHUB_SHA" |
            node .github/scripts/ci-change-policy.mjs --stdin0

  fast-ci:
    name: Fast CI
    needs: change-scope
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && needs.change-scope.result == 'success'
    runs-on: ${{ needs.change-scope.outputs.runtime == 'true' && 'ubuntu-24.04' || 'ubuntu-slim' }}
    timeout-minutes: 15
    steps:
      - name: Accept non-runtime changes
        if: needs.change-scope.outputs.runtime != 'true'
        run: echo "Runtime validation is not required for this change set."

      - name: Check out repository
        if: needs.change-scope.outputs.runtime == 'true'
        uses: actions/checkout@v7

      - name: Set up pnpm
        if: needs.change-scope.outputs.runtime == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node.js
        if: needs.change-scope.outputs.runtime == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.change-scope.outputs.runtime == 'true'
        run: pnpm install --frozen-lockfile

      - name: Start Redis for lease integration
        if: needs.change-scope.outputs.runtime == 'true'
        run: |
          docker run --detach --name betterspend-fast-ci-redis \
            --publish 6379:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 10 \
            redis:7-alpine
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' betterspend-fast-ci-redis)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 1
          done
          docker logs betterspend-fast-ci-redis
          exit 1

      - name: Run local CI preflight
        if: needs.change-scope.outputs.runtime == 'true'
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          REQUIRE_REDIS_TEST: 'true'
        run: pnpm ci:preflight

  full-ci-proof:
    name: Full CI Proof
    needs: change-scope
    if: >-
      github.event_name == 'push'
      && needs.change-scope.outputs.runtime == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      available: ${{ steps.proof.outputs.available }}
    steps:
      - name: Find successful Full CI check for this commit
        id: proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          has_proof="$(node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.HEAD_SHA}/check-runs?filter=all&per_page=100`,
            {
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                'user-agent': 'betterspend-full-ci-proof',
                'x-github-api-version': '2022-11-28',
              },
            },
          );
          if (!response.ok) {
            throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
          }
          const { check_runs: checkRuns } = await response.json();
          process.stdout.write(
            String(
              checkRuns.some(
                (check) =>
                  check.name === 'Full CI' &&
                  check.app?.slug === 'github-actions' &&
                  check.status === 'completed' &&
                  check.conclusion === 'success',
              ),
            ),
          );
          NODE
          )"
          case "$has_proof" in
            true|false) ;;
            *)
              echo "Unexpected Full CI proof result: $has_proof" >&2
              exit 1
              ;;
          esac
          printf 'available=%s\n' "$has_proof" >> "$GITHUB_OUTPUT"

  full-ci:
    name: Full CI
    # Merge groups validate GitHub's combined queue SHA. A direct push still
    # runs here when that exact commit has no successful Full CI proof.
    needs: [change-scope, full-ci-proof]
    if: >-
      !cancelled()
      && needs.change-scope.result == 'success'
      && needs.change-scope.outputs.runtime == 'true'
      && github.event_name != 'pull_request'
      && needs.full-ci-proof.outputs.available != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
      REQUIRE_REDIS_TEST: 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: betterspend
          POSTGRES_DB: betterspend_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betterspend -d betterspend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test release workflow policy
        run: node --test .github/scripts/release-workflow-policy.test.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test -- --runInBand

      - name: Verify clean database migrations
        env:
          DATABASE_URL: postgresql://betterspend@127.0.0.1:5432/betterspend_test
        run: |
          pnpm --filter @betterspend/db db:validate-history
          pnpm --filter @betterspend/db db:migrate
          pnpm --filter @betterspend/db db:verify-migrations
          pnpm --filter @betterspend/db db:verify-auth-upgrade

      - name: Build shared package
        run: pnpm --filter @betterspend/shared build

      - name: Build database package
        run: pnpm --filter @betterspend/db build

      - name: Verify authentication integration
        env:
          DATABASE_URL: postgresql://betterspend@127.0.0.1:5432/betterspend_test
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            pnpm --filter @betterspend/api auth:verify-integration

      - name: Typecheck API
        run: pnpm --filter @betterspend/api typecheck

      - name: Typecheck web
        run: pnpm --filter @betterspend/web exec tsc --noEmit --incremental false

      - name: Validate Compose files
        run: |
          CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -base64 32)" docker compose --profile app --profile tools config >/dev/null
          PRODUCTION_ENV_FILE=.env.production.example IMAGE_TAG=sha-ci \
            docker compose --profile migrate --env-file .env.production.example -f compose.yaml -f compose.prod.yaml config >/dev/null

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: false

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: false

      - name: Build migrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/migrator.Dockerfile
          platforms: linux/amd64
          push: false

  validate:
    name: Validate
    if: always()
    needs: [change-scope, fast-ci, full-ci-proof, full-ci]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Report validation result
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          FAST_CI_RESULT: ${{ needs.fast-ci.result }}
          FULL_CI_PROOF: ${{ needs.full-ci-proof.outputs.available }}
          FULL_CI_PROOF_RESULT: ${{ needs.full-ci-proof.result }}
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
          EVENT_NAME: ${{ github.event_name }}
          RUNTIME_VALIDATION: ${{ needs.change-scope.outputs.runtime }}
        run: |
          test "$CHANGE_SCOPE_RESULT" = "success"
          case "$RUNTIME_VALIDATION" in true|false) ;; *) exit 1 ;; esac

          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$FAST_CI_RESULT" = "success"
            test "$FULL_CI_RESULT" = "skipped"
          elif [ "$RUNTIME_VALIDATION" = "false" ]; then
            test "$FAST_CI_RESULT" = "skipped"
            test "$FULL_CI_PROOF_RESULT" = "skipped"
            test "$FULL_CI_RESULT" = "skipped"
          else
            test "$FAST_CI_RESULT" = "skipped"
            if [ "$FULL_CI_RESULT" != "success" ]; then
              test "$EVENT_NAME" = "push"
              test "$FULL_CI_PROOF_RESULT" = "success"
              test "$FULL_CI_PROOF" = "true"
              test "$FULL_CI_RESULT" = "skipped"
            fi
          fi

  publish:
    name: Publish Images
    # Non-runtime main pushes stop at Validate. Tags force runtime validation
    # and may build missing exact-SHA sources before promotion.
    if: >-
      always()
      && github.event_name == 'push'
      && needs.change-scope.outputs.runtime == 'true'
      && needs.validate.result == 'success'
    needs: [change-scope, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve immutable source commit
        id: source_commit
        run: |
          commit_sha="$(git rev-parse 'HEAD^{commit}')"
          if ! printf '%s' "$commit_sha" | grep -Eq '^[0-9a-f]{40}([0-9a-f]{24})?$'; then
            echo "Unable to resolve an immutable source commit." >&2
            exit 1
          fi
          printf 'image_tag=sha-%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Validate release ref
        id: release_ref
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/release-policy.mjs validate-ref

      - name: Configure image settings
        id: image_settings
        env:
          GHCR_IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.release_tag }}
          SOURCE_IMAGE_TAG: ${{ steps.source_commit.outputs.image_tag }}
        run: |
          namespace="${GHCR_IMAGE_NAMESPACE:-$REPOSITORY_OWNER}"
          namespace="$(printf '%s' "$namespace" | tr '[:upper:]' '[:lower:]')"
          test -n "$namespace"
          {
            printf 'api_tag=%s/%s/betterspend-api:%s\n' "$REGISTRY" "$namespace" "$SOURCE_IMAGE_TAG"
            printf 'web_tag=%s/%s/betterspend-web:%s\n' "$REGISTRY" "$namespace" "$SOURCE_IMAGE_TAG"
            printf 'migrator_tag=%s/%s/betterspend-migrator:%s\n' "$REGISTRY" "$namespace" "$SOURCE_IMAGE_TAG"
            if [ -n "$RELEASE_TAG" ]; then
              printf 'api_release_tag=%s/%s/betterspend-api:%s\n' "$REGISTRY" "$namespace" "$RELEASE_TAG"
              printf 'web_release_tag=%s/%s/betterspend-web:%s\n' "$REGISTRY" "$namespace" "$RELEASE_TAG"
              printf 'migrator_release_tag=%s/%s/betterspend-migrator:%s\n' "$REGISTRY" "$namespace" "$RELEASE_TAG"
              printf 'api_latest_tag=%s/%s/betterspend-api:latest\n' "$REGISTRY" "$namespace"
              printf 'web_latest_tag=%s/%s/betterspend-web:latest\n' "$REGISTRY" "$namespace"
              printf 'migrator_latest_tag=%s/%s/betterspend-migrator:latest\n' "$REGISTRY" "$namespace"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing immutable images
        id: existing_images
        env:
          API_TAG: ${{ steps.image_settings.outputs.api_tag }}
          WEB_TAG: ${{ steps.image_settings.outputs.web_tag }}
          MIGRATOR_TAG: ${{ steps.image_settings.outputs.migrator_tag }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.release_tag }}
        run: |
          max_attempts=1
          retry_delay=5
          if [ -n "$RELEASE_TAG" ]; then
            # Publish jobs for the same commit are serialized. Brief retries
            # cover registry consistency before the tag fallback builds.
            max_attempts=3
          fi

          for image in API WEB MIGRATOR; do
            tag_variable="${image}_TAG"
            tag="${!tag_variable}"
            output_name="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')_exists"
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if inspect_output="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
                printf '%s=true\n' "$output_name" >> "$GITHUB_OUTPUT"
                break
              fi
              if printf '%s' "$inspect_output" | grep -Eqi 'manifest unknown|name unknown|not found'; then
                if [ "$attempt" -eq "$max_attempts" ]; then
                  printf '%s=false\n' "$output_name" >> "$GITHUB_OUTPUT"
                  break
                fi
                printf 'Retrying immutable image lookup for %s (attempt %s/%s).\n' \
                  "$tag" "$attempt" "$max_attempts"
              elif [ "$attempt" -eq "$max_attempts" ]; then
                printf 'Unable to determine whether %s exists:\n%s\n' "$tag" "$inspect_output" >&2
                exit 1
              fi
              sleep "$retry_delay"
            done
          done

      - name: Build and push API image
        if: steps.existing_images.outputs.api_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.api_tag }}

      - name: Build and push web image
        if: steps.existing_images.outputs.web_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.web_tag }}

      - name: Build and push migrator image
        if: steps.existing_images.outputs.migrator_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/migrator.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.migrator_tag }}

      - name: Stage release version aliases
        if: steps.release_ref.outputs.release_tag != ''
        env:
          API_SOURCE_TAG: ${{ steps.image_settings.outputs.api_tag }}
          API_RELEASE_TAG: ${{ steps.image_settings.outputs.api_release_tag }}
          WEB_SOURCE_TAG: ${{ steps.image_settings.outputs.web_tag }}
          WEB_RELEASE_TAG: ${{ steps.image_settings.outputs.web_release_tag }}
          MIGRATOR_SOURCE_TAG: ${{ steps.image_settings.outputs.migrator_tag }}
          MIGRATOR_RELEASE_TAG: ${{ steps.image_settings.outputs.migrator_release_tag }}
        run: |
          # Validate every existing version alias before writing any of them.
          # A released version may never move to a different manifest.
          for image in API WEB MIGRATOR; do
            source_variable="${image}_SOURCE_TAG"
            release_variable="${image}_RELEASE_TAG"
            source_tag="${!source_variable}"
            release_tag="${!release_variable}"
            output_name="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')_release_exists"

            if ! source_manifest="$(docker buildx imagetools inspect --raw "$source_tag" 2>&1)"; then
              printf 'Unable to inspect source image %s:\n%s\n' "$source_tag" "$source_manifest" >&2
              exit 1
            fi
            if release_manifest="$(docker buildx imagetools inspect --raw "$release_tag" 2>&1)"; then
              if [ "$release_manifest" != "$source_manifest" ]; then
                echo "Release image $release_tag already refers to a different manifest." >&2
                exit 1
              fi
              printf -v "$output_name" '%s' true
            elif printf '%s' "$release_manifest" | grep -Eqi 'manifest unknown|name unknown|not found'; then
              printf -v "$output_name" '%s' false
            else
              printf 'Unable to inspect release image %s:\n%s\n' "$release_tag" "$release_manifest" >&2
              exit 1
            fi
          done

          for image in API WEB MIGRATOR; do
            source_variable="${image}_SOURCE_TAG"
            release_variable="${image}_RELEASE_TAG"
            exists_variable="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')_release_exists"
            if [ "${!exists_variable}" = "true" ]; then
              continue
            fi
            docker buildx imagetools create \
              --tag "${!release_variable}" \
              "${!source_variable}"
          done

      - name: Verify staged release aliases
        if: steps.release_ref.outputs.release_tag != ''
        env:
          API_SOURCE_TAG: ${{ steps.image_settings.outputs.api_tag }}
          API_RELEASE_TAG: ${{ steps.image_settings.outputs.api_release_tag }}
          WEB_SOURCE_TAG: ${{ steps.image_settings.outputs.web_tag }}
          WEB_RELEASE_TAG: ${{ steps.image_settings.outputs.web_release_tag }}
          MIGRATOR_SOURCE_TAG: ${{ steps.image_settings.outputs.migrator_tag }}
          MIGRATOR_RELEASE_TAG: ${{ steps.image_settings.outputs.migrator_release_tag }}
        run: |
          for image in API WEB MIGRATOR; do
            source_variable="${image}_SOURCE_TAG"
            release_variable="${image}_RELEASE_TAG"
            source_manifest="$(docker buildx imagetools inspect --raw "${!source_variable}")"
            release_manifest="$(docker buildx imagetools inspect --raw "${!release_variable}")"
            if [ "$release_manifest" != "$source_manifest" ]; then
              echo "Release image ${!release_variable} does not match ${!source_variable}." >&2
              exit 1
            fi
          done

      - name: Update latest image aliases
        if: steps.release_ref.outputs.release_tag != ''
        env:
          API_RELEASE_TAG: ${{ steps.image_settings.outputs.api_release_tag }}
          API_LATEST_TAG: ${{ steps.image_settings.outputs.api_latest_tag }}
          WEB_RELEASE_TAG: ${{ steps.image_settings.outputs.web_release_tag }}
          WEB_LATEST_TAG: ${{ steps.image_settings.outputs.web_latest_tag }}
          MIGRATOR_RELEASE_TAG: ${{ steps.image_settings.outputs.migrator_release_tag }}
          MIGRATOR_LATEST_TAG: ${{ steps.image_settings.outputs.migrator_latest_tag }}
        run: |
          for image in API WEB MIGRATOR; do
            release_variable="${image}_RELEASE_TAG"
            latest_variable="${image}_LATEST_TAG"
            docker buildx imagetools create \
              --tag "${!latest_variable}" \
              "${!release_variable}"
          done
