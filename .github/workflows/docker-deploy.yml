name: Docker CI/CD

# Flow:
#   PR                -> review gate + fast CI in parallel -> validate result
#   merge group       -> full CI -> validate result
#   push to main      -> full CI -> validate result -> publish immutable images
#   push v* tag       -> full CI -> validate result -> promote -> deploy
#   workflow_dispatch -> full CI -> validate result (manual re-check / republish)
#
# Releases are tags. Any merge to main is instantly deployable because its
# images are already in GHCR under sha-<sha>; tagging just promotes it.

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: betterspend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  IMAGE_TAG: sha-${{ github.sha }}
  REGISTRY: ghcr.io

jobs:
  review-gate:
    name: Review Gate
    # The review apps do not run on Dependabot PRs.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test review gate policy
        run: node --test .github/scripts/review-gate-policy.test.mjs

      - name: Wait for external reviews
        env:
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/wait-for-review-gate.mjs

  fast-ci:
    name: Fast CI
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test release workflow policy
        run: node --test .github/scripts/release-workflow-policy.test.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test -- --runInBand

      - name: Build shared package
        run: pnpm --filter @betterspend/shared build

      - name: Build database package
        run: pnpm --filter @betterspend/db build

      - name: Typecheck API
        run: pnpm --filter @betterspend/api typecheck

      - name: Typecheck web
        run: pnpm --filter @betterspend/web exec tsc --noEmit --incremental false

      - name: Build API
        run: pnpm --filter @betterspend/api build

      - name: Build web
        run: pnpm --filter @betterspend/web build

      - name: Validate Compose files
        run: |
          CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -base64 32)" docker compose --profile app --profile tools config >/dev/null
          PRODUCTION_ENV_FILE=.env.production.example IMAGE_TAG=sha-ci \
            docker compose --profile migrate --env-file .env.production.example -f compose.yaml -f compose.prod.yaml config >/dev/null

  full-ci:
    name: Full CI
    # Merge groups validate GitHub's combined queue SHA. Pushes retain the
    # same proof for administrators who bypass the pull request rule.
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: betterspend
          POSTGRES_DB: betterspend_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betterspend -d betterspend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test release workflow policy
        run: node --test .github/scripts/release-workflow-policy.test.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test -- --runInBand

      - name: Verify clean database migrations
        env:
          DATABASE_URL: postgresql://betterspend@127.0.0.1:5432/betterspend_test
        run: |
          pnpm --filter @betterspend/db db:validate-history
          pnpm --filter @betterspend/db db:migrate
          pnpm --filter @betterspend/db db:verify-migrations
          pnpm --filter @betterspend/db db:verify-auth-upgrade

      - name: Build shared package
        run: pnpm --filter @betterspend/shared build

      - name: Build database package
        run: pnpm --filter @betterspend/db build

      - name: Verify authentication integration
        env:
          DATABASE_URL: postgresql://betterspend@127.0.0.1:5432/betterspend_test
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            pnpm --filter @betterspend/api auth:verify-integration

      - name: Typecheck API
        run: pnpm --filter @betterspend/api typecheck

      - name: Typecheck web
        run: pnpm --filter @betterspend/web exec tsc --noEmit --incremental false

      - name: Validate Compose files
        run: |
          CREDENTIAL_ENCRYPTION_KEY="$(openssl rand -base64 32)" docker compose --profile app --profile tools config >/dev/null
          PRODUCTION_ENV_FILE=.env.production.example IMAGE_TAG=sha-ci \
            docker compose --profile migrate --env-file .env.production.example -f compose.yaml -f compose.prod.yaml config >/dev/null

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: betterspend/application-images
          nofallback: true

      - name: Build API image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: false

      - name: Build web image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: false

      - name: Build migrator image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/migrator.Dockerfile
          platforms: linux/amd64
          push: false

  validate:
    name: Validate
    if: always()
    needs: [review-gate, fast-ci, full-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Report validation result
        env:
          FAST_CI_RESULT: ${{ needs.fast-ci.result }}
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEW_GATE_RESULT: ${{ needs.review-gate.result }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$FAST_CI_RESULT" = "success"
            test "$FULL_CI_RESULT" = "skipped"
            if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
              test "$REVIEW_GATE_RESULT" = "success"
            fi
          else
            test "$FAST_CI_RESULT" = "skipped"
            test "$FULL_CI_RESULT" = "success"
          fi

  publish:
    name: Publish Images
    # Every merge to main produces deployable artifacts. Release tags promote
    # those immutable artifacts without rebuilding or replacing sha-* tags.
    if: always() && github.event_name == 'push' && needs.validate.result == 'success'
    needs: validate
    outputs:
      release_tag: ${{ steps.release_ref.outputs.release_tag }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    concurrency:
      group: publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release ref
        id: release_ref
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/release-policy.mjs validate-ref

      - name: Configure image settings
        id: image_settings
        env:
          GHCR_IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.release_tag }}
        run: |
          namespace="${GHCR_IMAGE_NAMESPACE:-$REPOSITORY_OWNER}"
          namespace="$(printf '%s' "$namespace" | tr '[:upper:]' '[:lower:]')"
          test -n "$namespace"
          {
            printf 'api_tag=%s/%s/betterspend-api:%s\n' "$REGISTRY" "$namespace" "$IMAGE_TAG"
            printf 'web_tag=%s/%s/betterspend-web:%s\n' "$REGISTRY" "$namespace" "$IMAGE_TAG"
            printf 'migrator_tag=%s/%s/betterspend-migrator:%s\n' "$REGISTRY" "$namespace" "$IMAGE_TAG"
            if [ -n "$RELEASE_TAG" ]; then
              printf 'api_release_tag=%s/%s/betterspend-api:%s\n' "$REGISTRY" "$namespace" "$RELEASE_TAG"
              printf 'web_release_tag=%s/%s/betterspend-web:%s\n' "$REGISTRY" "$namespace" "$RELEASE_TAG"
              printf 'migrator_release_tag=%s/%s/betterspend-migrator:%s\n' "$REGISTRY" "$namespace" "$RELEASE_TAG"
              printf 'api_latest_tag=%s/%s/betterspend-api:latest\n' "$REGISTRY" "$namespace"
              printf 'web_latest_tag=%s/%s/betterspend-web:latest\n' "$REGISTRY" "$namespace"
              printf 'migrator_latest_tag=%s/%s/betterspend-migrator:latest\n' "$REGISTRY" "$namespace"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: betterspend/application-images
          nofallback: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing immutable images
        id: existing_images
        env:
          API_TAG: ${{ steps.image_settings.outputs.api_tag }}
          WEB_TAG: ${{ steps.image_settings.outputs.web_tag }}
          MIGRATOR_TAG: ${{ steps.image_settings.outputs.migrator_tag }}
        run: |
          for image in API WEB MIGRATOR; do
            tag_variable="${image}_TAG"
            tag="${!tag_variable}"
            output_name="$(printf '%s' "$image" | tr '[:upper:]' '[:lower:]')_exists"
            for attempt in 1 2 3; do
              if inspect_output="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
                printf '%s=true\n' "$output_name" >> "$GITHUB_OUTPUT"
                break
              fi
              if printf '%s' "$inspect_output" | grep -Eqi 'manifest unknown|name unknown|not found'; then
                printf '%s=false\n' "$output_name" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                printf 'Unable to determine whether %s exists:\n%s\n' "$tag" "$inspect_output" >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done

      - name: Require immutable source images for release
        if: steps.release_ref.outputs.release_tag != ''
        env:
          API_EXISTS: ${{ steps.existing_images.outputs.api_exists }}
          WEB_EXISTS: ${{ steps.existing_images.outputs.web_exists }}
          MIGRATOR_EXISTS: ${{ steps.existing_images.outputs.migrator_exists }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.release_tag }}
        run: |
          for image in API WEB MIGRATOR; do
            exists_variable="${image}_EXISTS"
            if [ "${!exists_variable}" != "true" ]; then
              echo "Missing immutable ${image,,} image for release $RELEASE_TAG." >&2
              exit 1
            fi
          done

      - name: Build and push API image
        if: github.ref == 'refs/heads/main' && steps.existing_images.outputs.api_exists != 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.api_tag }}

      - name: Build and push web image
        if: github.ref == 'refs/heads/main' && steps.existing_images.outputs.web_exists != 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.web_tag }}

      - name: Build and push migrator image
        if: github.ref == 'refs/heads/main' && steps.existing_images.outputs.migrator_exists != 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/migrator.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.migrator_tag }}

      - name: Promote release image aliases
        if: steps.release_ref.outputs.release_tag != ''
        env:
          API_SOURCE_TAG: ${{ steps.image_settings.outputs.api_tag }}
          API_RELEASE_TAG: ${{ steps.image_settings.outputs.api_release_tag }}
          API_LATEST_TAG: ${{ steps.image_settings.outputs.api_latest_tag }}
          WEB_SOURCE_TAG: ${{ steps.image_settings.outputs.web_tag }}
          WEB_RELEASE_TAG: ${{ steps.image_settings.outputs.web_release_tag }}
          WEB_LATEST_TAG: ${{ steps.image_settings.outputs.web_latest_tag }}
          MIGRATOR_SOURCE_TAG: ${{ steps.image_settings.outputs.migrator_tag }}
          MIGRATOR_RELEASE_TAG: ${{ steps.image_settings.outputs.migrator_release_tag }}
          MIGRATOR_LATEST_TAG: ${{ steps.image_settings.outputs.migrator_latest_tag }}
        run: |
          for image in API WEB MIGRATOR; do
            source_variable="${image}_SOURCE_TAG"
            release_variable="${image}_RELEASE_TAG"
            latest_variable="${image}_LATEST_TAG"
            docker buildx imagetools create \
              --tag "${!release_variable}" \
              --tag "${!latest_variable}" \
              "${!source_variable}"
          done

  deploy-preflight:
    name: Deploy Preflight
    # secrets context is unavailable in job-level `if`, so probe it here and
    # publish the result. Skips the whole deploy path until DEPLOY_SSH_*
    # secrets are configured, so tagging still releases images before
    # automated deployment exists.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for var in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!var}" ]; then
              echo "::warning::Secret ${var} is not set; production deploy will be skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then printf 'ready=true\n'; else printf 'ready=false\n'; fi >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Production
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
      && needs.deploy-preflight.outputs.ready == 'true'
    needs: [publish, deploy-preflight]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Protect this environment in repo settings (required reviewers, or none
    # for fully automatic deploys). Only tag pushes reach production here.
    environment: production
    concurrency:
      group: betterspend-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin production host key
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          # Pinned fingerprint from a secret; never trust-on-first-use.
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

      - name: Sync deploy files
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh_options="-o StrictHostKeyChecking=yes"
          # Explicit file list, no --delete: never risk touching .env.production
          rsync -avR -e "ssh $ssh_options" \
            compose.yaml \
            compose.prod.yaml \
            deploy/deploy.sh \
            deploy/rollback.sh \
            deploy/release-version.sh \
            deploy/Caddyfile \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/opt/betterspend/"

      - name: Run deploy script
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          # The publish job validates this tag before exposing it as an output;
          # single quotes keep the remote shell from touching anything else.
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "cd /opt/betterspend && ./deploy/deploy.sh '${{ needs.publish.outputs.release_tag }}'"
