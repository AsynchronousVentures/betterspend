name: Docker CI/CD

# Flow:
#   PR              -> validate (fast build check, cancels superseded runs)
#   push to main    -> validate -> publish immutable sha-<sha> images (no deploy)
#   push v* tag     -> validate -> publish -> deploy to production
#   workflow_dispatch -> validate (manual re-check / republish)
#
# Releases are tags. Any merge to main is instantly deployable because its
# images are already in GHCR under sha-<sha>; tagging just promotes it.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betterspend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_TAG: sha-${{ github.sha }}
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @betterspend/shared build

      - name: Build database package
        run: pnpm --filter @betterspend/db build

      - name: Typecheck API
        run: pnpm --filter @betterspend/api typecheck

      - name: Typecheck web
        run: pnpm --filter @betterspend/web exec tsc --noEmit --incremental false

      - name: Build API
        run: pnpm --filter @betterspend/api build

      - name: Build web
        run: pnpm --filter @betterspend/web build

      - name: Validate Compose files
        run: |
          docker compose config >/dev/null
          cp .env.production.example deploy/.env.production
          IMAGE_TAG=sha-ci docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml config >/dev/null

      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t betterspend-api:ci .

      - name: Build web image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://example.com -f docker/web.Dockerfile -t betterspend-web:ci .

      - name: Build migrator image
        run: docker build -f docker/migrator.Dockerfile -t betterspend-migrator:ci .

  publish:
    name: Publish Images
    # Every merge to main produces deployable artifacts; a tag re-publishes
    # the exact commit being released (no-op cache hit if identical).
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure image settings
        id: image_settings
        env:
          GHCR_IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          namespace="${GHCR_IMAGE_NAMESPACE:-$REPOSITORY_OWNER}"
          namespace="$(printf '%s' "$namespace" | tr '[:upper:]' '[:lower:]')"
          test -n "$namespace"
          web_api_url="${NEXT_PUBLIC_API_URL:-http://localhost:4001}"
          {
            printf 'api_tag=%s/%s/betterspend-api:%s\n' "$REGISTRY" "$namespace" "$IMAGE_TAG"
            printf 'web_tag=%s/%s/betterspend-web:%s\n' "$REGISTRY" "$namespace" "$IMAGE_TAG"
            printf 'migrator_tag=%s/%s/betterspend-migrator:%s\n' "$REGISTRY" "$namespace" "$IMAGE_TAG"
            printf 'web_api_url=%s\n' "$web_api_url"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.api_tag }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.image_settings.outputs.web_api_url }}
          tags: ${{ steps.image_settings.outputs.web_tag }}

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrator.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_settings.outputs.migrator_tag }}

  deploy:
    name: Deploy Production
    # Self-gating: skipped until DEPLOY_SSH_* secrets are configured, so
    # tagging still releases images before automated deployment exists.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
      && secrets.DEPLOY_SSH_HOST != ''
      && secrets.DEPLOY_SSH_USER != ''
      && secrets.DEPLOY_SSH_KEY != ''
    needs: publish
    runs-on: ubuntu-latest
    # Protect this environment in repo settings (required reviewers, or none
    # for fully automatic deploys). Only tag pushes reach production here.
    environment: production
    concurrency:
      group: betterspend-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Sync deploy files
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts
          # Explicit file list, no --delete: never risk touching .env.production
          rsync -av \
            deploy/deploy.sh \
            deploy/rollback.sh \
            deploy/docker-compose.prod.yml \
            deploy/Caddyfile \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:/opt/betterspend/"

      - name: Run deploy script
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            'cd /opt/betterspend && ./deploy.sh "$IMAGE_TAG"'
